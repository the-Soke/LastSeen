<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resolve Case - LastSeen</title>
  <style>
    :root {
      --ink: #122236;
      --ink-soft: #47607c;
      --bg: #f3efe7;
      --card: #fffdf9;
      --line: rgba(18, 34, 54, 0.14);
      --accent: #e3571a;
      --accent-dark: #ba4210;
      --ok: #116e59;
      --err: #ad2f1d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Georgia, serif;
    }
    .shell {
      max-width: 740px;
      margin: 0 auto;
      padding: 20px 14px 40px;
    }
    .nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .btn {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 13px;
      background: #fff;
      color: var(--ink);
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-dark); }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
    }
    .head {
      padding: 18px;
      border-bottom: 1px solid var(--line);
    }
    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -0.02em;
    }
    .sub {
      margin-top: 6px;
      color: var(--ink-soft);
      font-size: 14px;
      line-height: 1.5;
    }
    form {
      padding: 16px 18px 20px;
      display: grid;
      gap: 12px;
    }
    label {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--ink-soft);
    }
    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 15px;
      font-family: Georgia, serif;
      background: #fff;
      color: var(--ink);
    }
    textarea {
      min-height: 90px;
      resize: vertical;
    }
    .msg {
      min-height: 18px;
      font-size: 14px;
      line-height: 1.4;
    }
    .ok { color: var(--ok); }
    .err { color: var(--err); }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 680px) { .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="shell">
    <div class="nav">
        <a class="btn" href="/feed">Discovery Feed</a>
        <a class="btn" href="/report">New Report</a>
        <a class="btn" href="/auth">Log In / Sign Up</a>
        <a class="btn" href="/tip">Anonymous Tip</a>
        <a class="btn" href="/ai">AI Review</a>
      </div>

    <div class="card">
      <div class="head">
        <h1>Mark Child As Found</h1>
        <div class="sub">Log in with the account that filed the report, then mark your case as found.</div>
      </div>

      <form id="resolve-form">
        <div>
          <label for="case-id">Case ID</label>
          <input id="case-id" required />
        </div>
        <div>
          <label for="notes">Notes (optional)</label>
          <textarea id="notes" maxlength="1000" placeholder="Any context for coordinators..."></textarea>
        </div>
        <div>
          <button class="btn btn-primary" id="resolve-btn" type="submit">Mark As Found</button>
        </div>
        <div class="msg" id="msg"></div>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById('resolve-form');
    const caseIdEl = document.getElementById('case-id');
    const notesEl = document.getElementById('notes');
    const msgEl = document.getElementById('msg');
    const btn = document.getElementById('resolve-btn');

    const qs = new URLSearchParams(location.search);
    caseIdEl.value = qs.get('caseId') || '';
    ensureAuth();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msgEl.className = 'msg';
      msgEl.textContent = '';

      btn.disabled = true;
      btn.textContent = 'Updating...';
      try {
        const res = await fetch(`/api/reports/${encodeURIComponent(caseIdEl.value.trim())}/resolve`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            notes: notesEl.value.trim() || undefined,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(data.error || `Request failed (${res.status})`);
        }

        msgEl.className = 'msg ok';
        msgEl.textContent = `Case ${data.caseNumber || ''} marked as found. Notifications sent: ${data.notifications?.sent || 0}.`;
      } catch (err) {
        msgEl.className = 'msg err';
        msgEl.textContent = err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Mark As Found';
      }
    });

    async function ensureAuth() {
      try {
        const res = await fetch('/api/auth/me');
        if (res.ok) return;
      } catch (_) {}
      msgEl.className = 'msg err';
      msgEl.textContent = 'Please log in first.';
      setTimeout(() => { location.href = '/auth'; }, 600);
    }
  </script>
</body>
</html>
